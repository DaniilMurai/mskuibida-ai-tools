<title>AI-DLC approval gates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  AI-DLC approval gates — the one template for reading a stage's documents at its approval gate.

  Published ONCE per developer as a private Artifact with the `db` capability
  (capabilities: {db: {}}, icon "document"); never regenerated per stage. Every gate is rows
  INSIDE this artifact, written by the agent with the ArtifactData tool (see SKILL.md next to
  this file; scripts/gate_bundle.py builds the rows). The page renders whatever the rows say, live.
  Same tokens as the question forms and the story points pages.

  Data contract (what the agent writes — always NEW rows, a fresh id per presentation):

    gates/<id>                  {title, stage, stageName, phase?, intent, project?, unit?, round, why?,
                                 status: "open", createdAt (ISO), summary?, brief?,
                                 review?: {verdict, reviewer, iteration, file}, nextStage?,
                                 documents: [{key, title, path, kind, bytes, parts?}]}
      id: <intent>-<stage>[-<unit>]-<YYYYMMDDTHHMM>
      summary: Markdown (the agent's completion summary). brief: the review brief exactly as
      `aidlc engine review-brief review` prints it; the page parses its table and the
      `> R-NN Finding|Where|Required action:` quotes into an expandable findings table, and
      falls back to plain Markdown when the shape is not recognised.
    gates/<id>/documents/<key>  {n, key, title, path, kind: "markdown"|"questions"|"json"|"review", text}
      text: the file as is (JSON pretty-printed). A document longer than the row limit is split
      at its H2 headings into rows <key>-p1, <key>-p2, … with {key, part: 1.., parts: N}; the page
      joins the parts in order (an index entry carries `parts`).

    Views. By the document's key the page renders a purpose-built view, with a Text switch back
    to the document as written: entities (the `entities:` YAML block as cards and an entity
    diagram), rules (the `rules:` block as filterable tables by group), components (the
    `components:` block as a dependency graph and cards), unit dependencies (the `units:` block as
    build layers), the story map, stories (cards by epic with Given/When/Then criteria),
    requirements (tables by group), decisions (ADR cards), bolt plans, contract operations and
    traceability coverage. Any other document, or one whose shape is not recognised, is Markdown
    with every H2 a collapsible section. Ids such as FR1.2, BR3.5, US1.1, AC1.1.2, ADR-003, U3 or
    C4 that name something in this gate are links to it.

  What the page writes (the only thing the agent reads back, one `get` of gates/<id>):

    gates/<id>.notes[<document key>] = "text"   the developer's note for Claude on a document

  The decision itself is given in chat, as the engine prescribes; the page holds no decision.
  Link to a gate: <artifact url>#<id>. No hash: the list of gates.
-->

<style>
/* Layout: a reading desk. A compact sticky header carries the gate's facts; below it an outline
   rail on the left (documents and their sections) and a full-width column of collapsible blocks:
   summary, review findings, then every document in its own view. */
:root {
  --bg: #f2f4f7; --surface: #ffffff; --fg: #151b26; --muted: #5a6474; --line: #d6dce6; --line-soft: #e6eaf0;
  --accent: #b06f0c; --accent-soft: #fbefd9; --ink: #24427a; --ink-soft: #e2e9f6;
  --ok: #2c7a4f; --ok-soft: #e0f0e6; --warn: #a63a2b; --warn-soft: #fbe6e2; --head-h: 52px;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10141b; --surface: #181e28; --fg: #e5e9f0; --muted: #98a2b3; --line: #2b3442; --line-soft: #222a36;
  --accent: #eab062; --accent-soft: #3a2b14; --ink: #8fb0ec; --ink-soft: #1d2a42;
  --ok: #6cc28f; --ok-soft: #1a2f23; --warn: #ef8f7c; --warn-soft: #3d221d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10141b; --surface: #181e28; --fg: #e5e9f0; --muted: #98a2b3; --line: #2b3442; --line-soft: #222a36;
  --accent: #eab062; --accent-soft: #3a2b14; --ink: #8fb0ec; --ink-soft: #1d2a42;
  --ok: #6cc28f; --ok-soft: #1a2f23; --warn: #ef8f7c; --warn-soft: #3d221d; color-scheme: dark }

* { box-sizing: border-box; }
html { overflow-x: hidden; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body); margin: 0; }
/* Nothing widens the page: a block that can be wider than its column (a table, a diagram, code, a strip of
   layers or bolts) scrolls inside its own box, and every column, card and section lets its content shrink. */
.desk > *, #col > *, .block > .body, .block > .body > *, .vw, .vw > *, .secbody > *, .cards > *, .card > *, details.sub > *, .facts > dd { min-width: 0; max-width: 100%; }
.tablewrap, .diagram, pre, .layers, .bolts { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--ink); }
code { font: 500 .88em var(--mono); background: var(--ink-soft); padding: 1px 5px; border-radius: 3px; overflow-wrap: anywhere; }
button { font: 600 13px var(--body); border-radius: 6px; cursor: pointer; color: var(--fg); background: transparent; border: 1px solid var(--line); padding: 5px 10px; }
button:hover { border-color: var(--ink); }
button:focus-visible, summary:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, input[type="search"] { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
textarea { width: 100%; resize: vertical; }
.pill { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.pill.open, .pill.accent { color: var(--accent); border-color: var(--accent); }
.pill.warn { color: var(--warn); border-color: var(--warn); }
.pill.quiet { font-size: 10px; padding: 3px 6px; }
.hint { color: var(--muted); margin: 0; }
.mono { font: 500 12px var(--mono); }
.chip { display: inline-block; font: 500 11.5px/1.3 var(--mono); padding: 2px 6px; border-radius: 4px; background: var(--ink-soft); color: var(--ink); max-width: 100%; overflow-wrap: anywhere; }
.chip.muted { background: var(--line-soft); color: var(--muted); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.xref { color: var(--ink); text-decoration: none; border-bottom: 1px dotted var(--ink); cursor: pointer; }
.xref:hover { background: var(--ink-soft); }
#pop { position: fixed; z-index: 20; max-width: min(520px, 90vw); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.18); font-size: 13px; pointer-events: none; }
#pop b { font-family: var(--mono); font-weight: 500; color: var(--ink); margin-right: 6px; }
#pop p { margin: 2px 0 0; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

/* header */
.head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; }
.headrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 34px; }
.crumb { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.crumb a { color: inherit; text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
h1 { font: 700 20px/1.2 var(--display); margin: 0; min-width: 0; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: 12.5px; min-width: 0; }
.meta .sep::before { content: "·"; margin-right: 12px; }
.spacer { flex: 1 1 auto; }
.project { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; max-width: 110ch; overflow-wrap: anywhere; }
#status { font-size: 12.5px; color: var(--muted); }
#status.warn { color: var(--warn); }

/* page body */
main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; }
.desk { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
#rail { position: sticky; top: calc(var(--head-h) + env(safe-area-inset-top, 0px) + 10px); max-height: calc(100vh - var(--head-h) - 24px); overflow: auto; display: grid; gap: 2px; align-content: start; padding-right: 4px; }
.railh { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 4px 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.railh .tools { display: flex; gap: 4px; }
.railh button { font-size: 11px; padding: 2px 7px; border-color: transparent; color: var(--muted); }
.railh button:hover { border-color: var(--line); color: var(--fg); }
.rdoc { display: flex; align-items: center; gap: 6px; text-align: left; border: 1px solid transparent; padding: 5px 8px; border-radius: 6px; font-weight: 600; font-size: 13px; min-width: 0; width: 100%; cursor: pointer; }
.rdoc > .rtitle { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rdoc.active, .rsec.active { background: var(--ink-soft); border-color: transparent; color: var(--ink); }
.rsec { display: block; text-align: left; border: 1px solid transparent; padding: 3px 8px 3px 20px; border-radius: 6px; font-weight: 400; font-size: 12.5px; color: var(--muted); width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rsec:hover, .rdoc:hover { border-color: var(--line); color: var(--fg); }
.rsec.active { color: var(--ink); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.rgroup { display: grid; gap: 1px; margin-bottom: 4px; }
details.rgroup > summary { list-style: none; display: block; }
details.rgroup > summary::-webkit-details-marker { display: none; }
.rcaret { width: 14px; flex: none; color: var(--muted); font-size: 10px; text-align: center; cursor: pointer; border-radius: 4px; }
.rcaret:hover { color: var(--fg); background: var(--line-soft); }
details.rgroup[open] > summary .rcaret { transform: rotate(90deg); }
.rcaret.none { visibility: hidden; }
.railtoggle { display: none; }

#col { display: grid; gap: 12px; min-width: 0; }
.block { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.block > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 12px; min-height: 38px; }
.block > summary::-webkit-details-marker { display: none; }
.caret { width: 14px; flex: none; color: var(--muted); font-size: 11px; transition: transform .15s; }
details[open] > summary .caret { transform: rotate(90deg); }
.block > summary .bt { font: 600 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.block > summary h2 { font: 600 15px/1.25 var(--display); margin: 0; min-width: 0; overflow-wrap: anywhere; }
.block > summary .file { font: 400 11.5px var(--mono); color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; direction: rtl; text-align: left; }
.block > summary .file > span { direction: ltr; unicode-bidi: isolate; }
.block > summary .end { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.block > .body { padding: 4px 14px 14px; border-top: 1px solid var(--line-soft); min-width: 0; }
.block.sum .body { padding-top: 10px; }
.notebox { display: grid; gap: 4px; margin: 10px 0 2px; }
.notebox label { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.notebox label b { font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.notebox .stat { margin-left: auto; }
.notebox .stat.warn { color: var(--warn); }
.notebtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 9px; font-size: 11.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink-soft); color: var(--ink); }

/* findings table */
.ftable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ftable th, .ftable td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line-soft); }
.ftable th { font: 500 11px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ftable tr.frow { cursor: pointer; }
.ftable tr.frow:hover td { background: var(--ink-soft); }
.ftable tr.frow td:first-child { white-space: nowrap; font: 500 12px var(--mono); }
.ftable td.where { color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.ftable tr.fdet td { background: var(--bg); padding: 10px 14px 12px 32px; border-bottom: 1px solid var(--line); }
.fdet dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.fdet dt { font: 500 10.5px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.fdet dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.ftable tr.closed td { color: var(--muted); }
.outcome { font-size: 13px; margin: 0 0 8px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.outcome b { color: var(--fg); font-weight: 500; }
.sev { font: 500 10.5px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 6px; border-radius: 4px; background: var(--ink-soft); color: var(--muted); white-space: nowrap; }
.sev.hi { background: var(--warn-soft); color: var(--warn); }

/* markdown */
.md { min-width: 0; overflow-wrap: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4, .md h5 { font-family: var(--display); line-height: 1.25; margin: 1.3em 0 .45em; text-wrap: balance; }
.md h1 { font-size: 19px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; } .md h4, .md h5 { font-size: 14px; }
.md p, .md ul, .md ol, .md blockquote, .md pre { margin: 0 0 .8em; }
.md ul, .md ol { padding-left: 20px; }
.md li + li { margin-top: .15em; }
.md blockquote { border-left: 3px solid var(--accent); padding: 1px 0 1px 12px; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1.2em 0; }
.md pre, .jsonbox pre, .src { font: 400 12.5px/1.45 var(--mono); background: var(--ink-soft); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 0 0 .8em; white-space: pre; }
.md pre code { background: none; padding: 0; font-size: inherit; }
.tablewrap { overflow-x: auto; margin: 0 0 .8em; border: 1px solid var(--line); border-radius: 6px; }
.md table, table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
.md th, .md td, table.grid th, table.grid td { text-align: left; vertical-align: top; padding: 5px 9px; border-bottom: 1px solid var(--line-soft); }
.md th, table.grid th { background: var(--ink-soft); font-weight: 600; white-space: nowrap; }
.md tr:last-child td, table.grid tr:last-child td { border-bottom: 0; }
table.grid th { font: 500 11px/1.4 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); background: transparent; }
table.grid td.id { font: 500 12px var(--mono); white-space: nowrap; color: var(--ink); }
table.grid td.dim, tr.dim td { color: var(--muted); font-size: 12.5px; }
.md img { max-width: 100%; }
.diagram { overflow-x: auto; margin: 0 0 .8em; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.diagram svg { max-width: none; height: auto; }
.diagram .note, .jsonnote { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
.jsonbox pre { margin: 0; max-height: 60vh; }
.plain { white-space: pre-wrap; font: 400 12.5px/1.45 var(--mono); }
details.sec { border-top: 1px solid var(--line-soft); }
details.sec:first-child { border-top: 0; }
details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 7px 0; flex-wrap: wrap; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary h1, details.sec > summary h2, details.sec > summary h3 { margin: 0; font: 600 15px/1.25 var(--display); min-width: 0; }
details.sec > summary .cnt { color: var(--muted); font-size: 11.5px; font-family: var(--mono); margin-left: auto; white-space: nowrap; }
details.sec > .secbody { padding: 2px 0 10px 22px; }
.md.flat { padding-top: 10px; }

/* views */
.vtools { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 0 6px; font-size: 12.5px; color: var(--muted); }
.vtools input[type="search"] { width: 220px; max-width: 100%; padding: 4px 8px; font-size: 12.5px; }
.vtools .fchip { cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 500 11.5px var(--mono); padding: 3px 8px; border-radius: 999px; }
.vtools .fchip[aria-pressed="true"] { background: var(--ink-soft); color: var(--ink); border-color: var(--ink); }
.cards { display: grid; gap: 10px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; background: var(--surface); }
.card.flat { border: 0; padding: 0; }
.chead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 4px; }
.chead h3, .chead h4 { margin: 0; font: 600 14.5px/1.3 var(--display); min-width: 0; }
.chead .end { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 13px; margin: 6px 0; }
.facts dt { font: 500 10.5px/1.9 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts dd ul { margin: 0; padding-left: 18px; }
.desc { margin: 0 0 6px; }
.gwt { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px 12px; font-size: 13px; }
.gwt > div > b { font: 500 10.5px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); display: block; }
.ac { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; padding: 6px 0; border-top: 1px solid var(--line-soft); align-items: start; }
.ac:first-child { border-top: 0; }
.ac .acid { font: 500 11.5px/1.6 var(--mono); color: var(--ink); white-space: nowrap; }
.ac .tags { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: middle; }
.rule-logic { white-space: pre-wrap; font: 400 12.5px/1.5 var(--mono); background: var(--ink-soft); border-radius: 6px; padding: 8px 10px; margin: 6px 0; }
.rule-logic .kw { color: var(--accent); font-weight: 500; }
tr.rrow { cursor: pointer; }
tr.rrow:hover td { background: var(--ink-soft); }
tr.rdet td { background: var(--bg); padding: 8px 14px 10px 28px; }
.attr td.id { color: var(--fg); font-weight: 500; }
.attr td.ty, td.ty { font: 400 12.5px var(--mono); color: var(--muted); white-space: nowrap; }
.layers { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 8px; align-items: stretch; }
.layer { flex: 0 0 auto; min-width: 150px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; align-content: start; }
.layer > b { font: 500 10.5px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.unit { padding: 5px 8px; border-radius: 6px; background: var(--ink-soft); font-size: 12.5px; display: grid; gap: 2px; }
.unit b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.unit small { color: var(--muted); }
.bolts { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0 8px; }
.bolt { flex: 1 0 180px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; }
.bolt b { font: 600 13.5px var(--display); }
.bolt .bar { height: 6px; border-radius: 3px; background: var(--line-soft); overflow: hidden; }
.bolt .bar i { display: block; height: 100%; background: var(--ink); }
.cov { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.wrap { display: flex; flex-wrap: wrap; gap: 4px 6px; }
details.sub > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 4px 0; }

/* index */
#list { display: grid; gap: 6px; max-width: 900px; }
#list h2 { font: 500 11px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 2px; overflow-wrap: anywhere; }
#list h2:first-child { margin-top: 0; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; padding: 9px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: inherit; text-decoration: none; }
.row:hover { border-color: var(--ink); }
.row b { font: 600 14px/1.3 var(--display); }
.row small { color: var(--muted); display: block; }
.empty { padding: 16px; border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); display: grid; gap: 6px; max-width: 66ch; }
.empty p { margin: 0; }

@media (max-width: 900px) {
  .desk { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  #rail { position: static; max-height: none; display: none; }
  #rail.show { display: grid; }
  .railtoggle { display: inline-block; }
  .block > summary .file { display: none; }
  h1 { font-size: 17px; }
  .gwt { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; animation: none !important; } }
</style>

<div class="head">
  <div class="headrow">
    <span class="crumb" id="crumb">AI-DLC approval gates</span>
    <h1 id="title">Approval gates</h1>
    <div class="meta" id="meta" hidden></div>
    <span class="spacer"></span>
    <span id="status" hidden></span>
    <button type="button" class="railtoggle" id="railtoggle" hidden>Outline</button>
  </div>
  <p class="project" id="lede">Connecting to your gates…</p>
</div>
<main>
  <div id="list" hidden></div>
  <div class="desk" id="gate" hidden>
    <nav id="rail" aria-label="Outline"></nav>
    <div id="col"></div>
  </div>
</main>
<div id="pop" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const el = { crumb: $("crumb"), title: $("title"), lede: $("lede"), meta: $("meta"), list: $("list"), gate: $("gate"), rail: $("rail"), col: $("col"),
    status: $("status"), railtoggle: $("railtoggle"), pop: $("pop") };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (iso) => { try { return new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }); } catch { return iso || ""; } };
  const clock = () => new Date().toLocaleTimeString([], { timeStyle: "short" });
  const gateId = () => { const h = decodeURIComponent(location.hash.replace(/^#/, "")); return /^[a-z0-9._-]+$/i.test(h) ? h : ""; };
  const setStatus = (t, cls) => { el.status.textContent = t || ""; el.status.className = cls || ""; el.status.hidden = !t; };
  const WHY = { first: "first presentation", revision: "after a revision", stale: "review was out of date" };
  const KIND = { questions: "questions", json: "JSON", review: "review" };
  const upper = (s) => String(s || "").replace(/^./, (c) => c.toUpperCase());
  const kb = (n) => n >= 1024 ? Math.round(n / 1024) + " KB" : n + " B";
  const str = (v) => v === undefined || v === null ? "" : (typeof v === "object" ? JSON.stringify(v) : String(v));

  let db = null;
  const view = { id: "", unsub: [], gate: null, docs: new Map(), docsLoaded: false, notes: {}, unsaved: false, saving: false,
    noteTimer: null, painted: "", diagrams: 0, openNotes: new Set(), railSig: "", mode: {}, refs: new Map(), railOpen: {} };
  const hasMd = () => typeof marked !== "undefined" && typeof DOMPurify !== "undefined";

  function teardown() {
    view.unsub.forEach((u) => { try { u(); } catch {} });
    Object.assign(view, { unsub: [], gate: null, docs: new Map(), docsLoaded: false, notes: {}, unsaved: false, saving: false, painted: "", railSig: "", openNotes: new Set(), mode: {}, refs: new Map(), railOpen: {} });
    clearTimeout(view.noteTimer);
    el.rail.innerHTML = ""; el.col.innerHTML = "";
  }

  /* ---------- markdown ---------- */
  if (hasMd()) {
    DOMPurify.addHook("afterSanitizeAttributes", (node) => {
      if (node.tagName === "A") {
        const href = node.getAttribute("href") || "";
        if (/^https?:\/\//i.test(href)) { node.setAttribute("target", "_blank"); node.setAttribute("rel", "noopener noreferrer"); }
        else node.removeAttribute("href");
      }
    });
  }
  const isDark = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  function mdHtml(text, breaks) {
    if (!hasMd()) return null;
    try { return DOMPurify.sanitize(marked.parse(String(text ?? ""), { gfm: true, breaks: !!breaks }), { USE_PROFILES: { html: true } }); }
    catch { return null; }
  }
  /* inline markdown (bold, code, links) for one line of text */
  const inline = (text) => { if (!hasMd()) return esc(text); try { return DOMPurify.sanitize(marked.parseInline(String(text ?? "")), { USE_PROFILES: { html: true } }); } catch { return esc(text); } };
  function renderMarkdown(target, text, breaks) {
    const html = mdHtml(text, breaks);
    if (html === null) { target.innerHTML = '<pre class="plain"></pre>'; target.firstChild.textContent = text; return; }
    target.innerHTML = html;
    decorate(target);
  }
  function decorate(root) {
    root.querySelectorAll("table").forEach((t) => { if (t.parentElement.classList.contains("tablewrap")) return; const w = document.createElement("div"); w.className = "tablewrap"; t.replaceWith(w); w.appendChild(t); });
    root.querySelectorAll("pre > code.language-mermaid").forEach((code) => { code.parentElement.replaceWith(diagramBox(code.textContent)); });
  }
  function diagramBox(source) {
    const box = document.createElement("div"); box.className = "diagram"; box.dataset.src = source;
    const src = document.createElement("pre"); src.className = "src"; src.textContent = source; box.appendChild(src);
    return box;
  }
  /* A diagram is drawn when its section is open; the source stays when it cannot be drawn. */
  function drawDiagrams(root) {
    root.querySelectorAll(".diagram:not([data-drawn])").forEach((box) => {
      if (!isOpen(box)) return;
      box.dataset.drawn = "1";
      const source = box.dataset.src;
      if (typeof mermaid === "undefined") { box.insertAdjacentHTML("afterbegin", '<p class="note">The diagram library did not load, so the source is shown.</p>'); return; }
      const id = "mmd" + (++view.diagrams);
      try {
        mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDark() ? "dark" : "neutral", fontFamily: "IBM Plex Sans, system-ui, sans-serif" });
        Promise.resolve(mermaid.render(id, source)).then((out) => { box.innerHTML = out.svg; })
          .catch(() => { document.getElementById("d" + id)?.remove(); box.insertAdjacentHTML("afterbegin", '<p class="note">This diagram could not be drawn, so its source is shown.</p>'); });
      } catch { box.insertAdjacentHTML("afterbegin", '<p class="note">This diagram could not be drawn, so its source is shown.</p>'); }
    });
  }
  function isOpen(node) { let d = node.closest("details"); while (d) { if (!d.open) return false; d = d.parentElement && d.parentElement.closest("details"); } return true; }

  /* ---------- index ---------- */
  function showIndex() {
    teardown(); view.id = "";
    el.title.textContent = "Approval gates";
    el.crumb.textContent = "AI-DLC approval gates";
    el.lede.textContent = "Every stage's documents, read before you are asked to approve. Pick a gate; notes you leave on a document go back to Claude.";
    el.meta.hidden = true; el.gate.hidden = true; el.list.hidden = false; el.lede.hidden = false; el.railtoggle.hidden = true; setStatus("");
    el.list.innerHTML = '<div class="empty"><p>Loading gates…</p></div>';
    if (!db) return;
    view.unsub.push(db.collection("gates").orderBy("createdAt", "desc").limit(100).onSnapshot((snap) => {
      if (snap.empty) { el.list.innerHTML = '<div class="empty"><p><b>No gates yet.</b></p><p>Claude adds one here at every approval gate and gives you its link, which ends in <code>#</code> and the gate’s id.</p></div>'; return; }
      const groups = new Map();
      snap.docs.forEach((d) => { const g = d.data(); const k = g.intent || "Other"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push({ id: d.id, g }); });
      el.list.innerHTML = [...groups].map(([intent, rows]) => `<h2>${esc(intent)}</h2>` + rows.map(({ id, g }) => {
        const n = (g.documents || []).length;
        return `<a class="row" href="#${esc(id)}"><span><b>${esc(g.title || g.stageName || id)}</b><small>Round ${esc(g.round || 1)} · ${esc(fmt(g.createdAt))}${n ? ` · ${n} document${n === 1 ? "" : "s"}` : ""}</small></span><span class="pill quiet">${esc(g.phase || "")}</span></a>`;
      }).join("")).join("");
    }, () => { el.list.innerHTML = '<div class="empty"><p>Couldn’t load the gates. Reload the page.</p></div>'; }));
  }

  /* ---------- one gate ---------- */
  function showGate(id) {
    teardown(); view.id = id;
    el.list.hidden = true; el.gate.hidden = false; el.meta.hidden = true; el.lede.hidden = false; el.railtoggle.hidden = false;
    el.title.textContent = id; el.lede.textContent = "Loading the gate…";
    el.crumb.innerHTML = '<a href="#">All gates</a>';
    el.col.innerHTML = '<p class="hint">Loading documents…</p>';
    setStatus("");
    if (!db) return;
    const ref = db.doc("gates/" + id);
    view.unsub.push(ref.onSnapshot((snap) => {
      if (!snap.exists) {
        view.gate = null; el.title.textContent = "Waiting for this gate";
        el.lede.textContent = "Nothing is stored under this id yet. Claude writes the gate just before it asks you, and this page fills in when it lands. If nothing happens, check the link Claude gave you.";
        el.meta.hidden = true; el.col.innerHTML = ""; el.rail.innerHTML = ""; return;
      }
      view.gate = snap.data(); paintGate();
    }, () => { setStatus("Couldn’t load the gate. Reload the page.", "warn"); el.lede.textContent = "Couldn’t load the gate."; }));
    view.unsub.push(ref.collection("documents").orderBy("n").onSnapshot((snap) => {
      const next = new Map(); snap.docs.forEach((d) => next.set(d.id, d.data()));
      view.docs = next; view.docsLoaded = true; paintAll();
    }, () => { el.col.innerHTML = '<div class="empty"><p>Couldn’t load the documents. Reload the page.</p></div>'; }));
  }

  function paintGate() {
    const g = view.gate; if (!g) return;
    el.title.textContent = g.title || g.stageName || view.id;
    el.crumb.innerHTML = `<a href="#">All gates</a> · ${esc(g.intent || "")}`;
    el.lede.textContent = g.project || ""; el.lede.hidden = !g.project;
    el.meta.hidden = false;
    el.meta.innerHTML = [g.phase ? `<span>${esc(upper(g.phase))}</span>` : "", `<span class="sep">Round ${esc(g.round || 1)}${g.why ? ", " + esc(WHY[g.why] || g.why) : ""}</span>`,
      g.createdAt ? `<span class="sep">${esc(fmt(g.createdAt))}</span>` : "", g.nextStage ? `<span class="sep">then ${esc(g.nextStage)}</span>` : ""].join("");
    if (!view.unsaved && !view.saving) view.notes = Object.assign({}, g.notes || {});
    paintAll();
  }

  /* ---------- documents: parts joined, index order ---------- */
  function docList() {
    const idx = (view.gate && view.gate.documents) || [];
    const byKey = new Map();
    view.docs.forEach((d) => {
      const key = d.key || d.id; const cur = byKey.get(key) || { parts: [] };
      cur.parts.push(Object.assign({ part: d.part || 1 }, d)); byKey.set(key, cur);
    });
    const out = []; const seen = new Set();
    const push = (key, meta) => {
      if (seen.has(key)) return; seen.add(key);
      const got = byKey.get(key);
      if (!got) { out.push(Object.assign({ pending: true, key }, meta || {})); return; }
      const parts = got.parts.sort((a, b) => a.part - b.part);
      const want = (meta && meta.parts) || parts[0].parts || parts.length;
      const text = parts.map((p) => p.text || "").join("\n\n");
      out.push(Object.assign({}, meta || {}, parts[0], { key, text, partial: parts.length < want, n: parts[0].n }));
    };
    idx.forEach((d) => push(d.key, d));
    [...byKey.keys()].sort((a, b) => ((byKey.get(a).parts[0].n || 0) - (byKey.get(b).parts[0].n || 0))).forEach((k) => push(k));
    return out;
  }

  function paintAll() {
    if (!view.gate) return;
    const g = view.gate; const docs = docList();
    const sig = JSON.stringify([view.id, g.summary, g.brief, g.review, docs.map((d) => [d.key, d.title, d.kind, d.text, !!d.pending, !!d.partial]), isDark(), view.mode]);
    if (sig === view.painted) { paintRail(docs); return; }
    view.painted = sig; view.refs = new Map();
    const frag = [];
    if (g.summary) frag.push(`<details class="block sum" open id="b-summary"><summary><span class="caret">▶</span><span class="bt">Summary</span></summary><div class="body md" id="summarymd"></div></details>`);
    if (g.brief) frag.push(briefBlock(g));
    if (!docs.length) frag.push(view.docsLoaded ? '<div class="empty"><p><b>No documents yet.</b></p><p>Claude writes them with the gate; they appear here as soon as they land.</p></div>' : '<p class="hint">Loading documents…</p>');
    docs.forEach((d, i) => frag.push(docBlock(d, i)));
    el.col.innerHTML = frag.join("");
    if (g.summary) renderMarkdown($("summarymd"), g.summary);
    if (g.brief) fillBrief(g);
    docs.forEach((d, i) => fillDoc(d, i));
    linkRefs(el.col);
    drawDiagrams(el.col);
    view.railSig = ""; paintRail(docs);
  }

  /* ---------- the review brief ---------- */
  function parseBrief(text) {
    const lines = String(text || "").split(/\r?\n/);
    const head = {}; const rows = []; const quotes = {};
    let inTable = false, cur = null;
    for (const raw of lines) {
      const line = raw.trimEnd();
      let m;
      if ((m = line.match(/^\*\*(Stage|Review outcome|Why now|Review artifact):\*\*\s*(.*)$/))) { head[m[1]] = m[2].replace(/^`|`$/g, ""); cur = null; continue; }
      if (/^\|/.test(line)) {
        const cells = line.split("|").slice(1, -1).map((c) => c.trim());
        if (/^-+$/.test(cells[0] || "x")) { inTable = true; continue; }
        if (!inTable) { if (!/^id$/i.test(cells[0] || "")) return null; continue; }
        if (cells.length >= 4) rows.push({ id: cells[0], severity: cells[1], where: cells[2], status: cells[3] });
        cur = null; continue;
      }
      inTable = inTable && line === "" ? false : inTable;
      if ((m = line.match(/^>\s*(R-\d+|[A-Z]+-\d+)\s+(Finding|Where|Required action):\s*(.*)$/))) {
        cur = [m[1], m[2]]; quotes[m[1]] = quotes[m[1]] || {}; quotes[m[1]][m[2]] = m[3]; continue;
      }
      if (cur && /^>\s?/.test(line)) { quotes[cur[0]][cur[1]] += "\n" + line.replace(/^>\s?/, ""); continue; }
      if (line === "" ) { cur = null; }
    }
    if (!rows.length && !head["Review outcome"]) return null;
    return { head, rows: rows.map((r) => Object.assign(r, quotes[r.id] || {})) };
  }
  const isOpenStatus = (s) => /^(new|unresolved)$/i.test(String(s || "").trim());
  const isHi = (s) => /^(critical|major)$/i.test(String(s || "").trim());
  function briefBlock(g) {
    const b = parseBrief(g.brief); const r = g.review || {};
    const open = b ? b.rows.filter((x) => isOpenStatus(x.status)) : [];
    const hi = open.filter((x) => isHi(x.severity)).length;
    const verdict = r.verdict ? `<span class="pill ${/^ready$/i.test(r.verdict) ? "ok" : "warn"}">${esc(r.verdict)}</span>` : "";
    const count = b ? (open.length ? `<span class="pill ${hi ? "warn" : "accent"}">${open.length} open${hi ? ` · ${hi} blocking` : ""}</span>` : `<span class="pill ok">no open findings</span>`) : "";
    const who = [r.reviewer, r.iteration ? "iteration " + r.iteration : ""].filter(Boolean).join(" · ");
    return `<details class="block" id="b-brief"${open.length ? " open" : ""}><summary><span class="caret">▶</span><span class="bt">Review</span>${verdict}${count}<span class="hint">${esc(who)}</span></summary><div class="body" id="briefbody"></div></details>`;
  }
  function fillBrief(g) {
    const body = $("briefbody"); const b = parseBrief(g.brief);
    if (!b) { body.className = "body md"; renderMarkdown(body, g.brief, true); return; }
    const h = b.head;
    let html = `<p class="outcome">${h["Review outcome"] ? `<b>${esc(h["Review outcome"])}</b>` : ""}${h["Why now"] ? `<span>${esc(h["Why now"])}</span>` : ""}${h["Review artifact"] ? `<span class="mono">${esc(h["Review artifact"])}</span>` : ""}</p>`;
    if (b.rows.length) {
      html += `<div class="tablewrap"><table class="ftable"><thead><tr><th>ID</th><th>Severity</th><th>Where</th><th>Status</th></tr></thead><tbody>` + b.rows.map((r, i) => {
        const open = isOpenStatus(r.status); const det = r.Finding || r.Where || r["Required action"];
        return `<tr class="frow${open ? "" : " closed"}" data-i="${i}" data-ref="${esc(r.id)}" aria-expanded="${open && i < 3 ? "true" : "false"}"><td>${esc(r.id)}</td><td><span class="sev${isHi(r.severity) ? " hi" : ""}">${esc(r.severity)}</span></td><td class="where">${esc(r.where)}</td><td>${esc(r.status)}</td></tr>` +
          (det ? `<tr class="fdet" data-for="${i}"${open && i < 3 ? "" : " hidden"}><td colspan="4"><dl>${r.Finding ? `<dt>Finding</dt><dd>${esc(r.Finding)}</dd>` : ""}${r.Where ? `<dt>Where</dt><dd>${esc(r.Where)}</dd>` : ""}${r["Required action"] ? `<dt>Required action</dt><dd>${esc(r["Required action"])}</dd>` : ""}</dl></td></tr>` : "");
      }).join("") + `</tbody></table></div>`;
    }
    body.innerHTML = html;
    body.querySelectorAll("tr.frow").forEach((tr) => { regRef(tr.dataset.ref, tr, tr.textContent.trim().replace(/\s+/g, " ")); tr.addEventListener("click", () => {
      const det = body.querySelector(`tr.fdet[data-for="${tr.dataset.i}"]`); if (!det) return;
      det.hidden = !det.hidden; tr.setAttribute("aria-expanded", String(!det.hidden));
    }); });
  }

  /* ---------- a document block ---------- */
  function docBlock(d, i) {
    const note = (view.notes[d.key] || "").trim();
    const file = d.path ? `<span class="file" title="${esc(d.path)}"><span>${esc(d.path)}</span></span>` : "";
    const size = d.bytes ? `<span class="hint mono">${kb(d.bytes)}</span>` : "";
    const closed = (d.kind === "json" && !viewFor(d)) || d.kind === "questions" || d.kind === "review";
    return `<details class="block doc" id="d-${esc(d.key)}"${closed ? "" : " open"}>
      <summary><span class="caret">▶</span><h2>${esc(d.title || d.key)}</h2>${KIND[d.kind] ? `<span class="pill quiet">${KIND[d.kind]}</span>` : ""}${file}<span class="end">${size}${note ? '<i class="dot" title="You left a note"></i>' : ""}<span class="seg" id="seg-${esc(d.key)}" hidden><button type="button" data-mode="view" data-key="${esc(d.key)}">View</button><button type="button" data-mode="text" data-key="${esc(d.key)}">Text</button></span><button type="button" class="notebtn" data-key="${esc(d.key)}" aria-pressed="${view.openNotes.has(d.key) || note ? "true" : "false"}">Note</button></span></summary>
      <div class="body"><div class="notebox" id="nb-${esc(d.key)}"${view.openNotes.has(d.key) || note ? "" : " hidden"}><label for="nt-${esc(d.key)}"><b>Note for Claude</b><span>on this document, saved as you type</span><span class="stat" id="ns-${esc(d.key)}"></span></label><textarea id="nt-${esc(d.key)}" rows="2" placeholder="Something to change, check or keep in mind"></textarea></div><div id="db-${esc(d.key)}"></div></div>
    </details>`;
  }
  function fillDoc(d, i) {
    const body = $("db-" + d.key); const ta = $("nt-" + d.key);
    ta.value = view.notes[d.key] || "";
    ta.addEventListener("input", () => noteEdited(d.key, ta.value));
    ta.addEventListener("blur", () => { if (view.unsaved) flushNotes(); });
    if (d.pending) { body.innerHTML = '<p class="hint">This document is still being written.</p>'; return; }
    if (d.partial) body.insertAdjacentHTML("beforeend", '<p class="hint">Part of this document is still being written.</p>');
    const vf = viewFor(d);
    const mode = view.mode[d.key] || "view";
    if (vf && mode === "view") {
      let built = null;
      try { built = vf.render(d, i); } catch (e) { built = null; console.warn("view failed", d.key, e); }
      if (built) {
        $("seg-" + d.key).hidden = false; setSeg(d.key, "view");
        body.appendChild(built);
        body.querySelectorAll("details.sec").forEach((s) => s.addEventListener("toggle", () => { if (s.open) drawDiagrams(s); }));
        return;
      }
    }
    if (vf && mode === "text") { $("seg-" + d.key).hidden = false; setSeg(d.key, "text"); }
    fillText(body, d, i);
  }
  function setSeg(key, mode) { const seg = $("seg-" + key); if (!seg) return; seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode))); }
  function fillText(body, d, i) {
    if (d.kind === "json") {
      const text = String(d.text ?? ""); const lines = text.split("\n").length;
      body.innerHTML = `<div class="jsonbox"><p class="jsonnote">JSON · ${lines} line${lines === 1 ? "" : "s"}</p><pre></pre></div>`;
      body.querySelector("pre").textContent = text; return;
    }
    const html = mdHtml(d.text);
    if (html === null) { body.innerHTML = '<pre class="plain"></pre>'; body.firstChild.textContent = d.text; return; }
    const tmp = document.createElement("div"); tmp.innerHTML = html; decorate(tmp);
    promoteTitle(tmp, d);
    sectionize(tmp, d, i === 0);
    body.innerHTML = ""; body.appendChild(tmp); tmp.className = "md" + (tmp.querySelector("details.sec") ? "" : " flat");
    tmp.querySelectorAll("details.sec").forEach((s) => s.addEventListener("toggle", () => { if (s.open) drawDiagrams(s); }));
    registerMdRefs(tmp);
  }
  function promoteTitle(tmp, d) {
    const first = tmp.firstElementChild;
    if (first && first.tagName === "H1" && tmp.querySelectorAll("h1").length === 1) {
      const h = $("d-" + d.key).querySelector("summary h2"); if (h && first.textContent.trim()) h.textContent = first.textContent.trim();
      first.remove();
    }
  }
  /* Every H2 (or H1 when there are several) starts a collapsible section. */
  function sectionize(root, d, expand, level) {
    const kids = [...root.childNodes];
    level = level || (kids.filter((n) => n.nodeType === 1 && n.tagName === "H2").length >= 1 ? "H2" : (kids.filter((n) => n.nodeType === 1 && n.tagName === "H1").length >= 2 ? "H1" : null));
    if (!level) return;
    const out = document.createDocumentFragment(); let cur = null, n = 0, lead = null;
    const flush = () => { if (cur) { const cnt = cur.secbody.querySelectorAll("p, li, tr, pre").length; cur.querySelector(".cnt").textContent = cnt ? cnt + " items" : ""; } };
    kids.forEach((node) => {

  /* --- id-anchored markdown helpers --- */

  /* --- stories: cards by epic --- */

  function viewBolts(d) {
    let secs = splitHeadings(d.text, "##"); let bolts = secs.filter((s) => /^bolt\s*\d+/i.test(s.title));
    if (!bolts.length) { /* bolts as H3 under milestone H2s: flatten to one list, each bolt tagged with its milestone */
      const flat = [secs[0]]; secs.slice(1).forEach((s) => { const inner = splitHeadings(s.body, "###"); const hits = inner.filter((x) => /^bolt\s*\d+/i.test(x.title)); if (hits.length) { if (inner[0].body.trim()) flat.push({ title: s.title, body: inner[0].body }); hits.forEach((x) => flat.push(Object.assign(x, { group: s.title }))); } else flat.push(s); });
      secs = flat; bolts = secs.filter((s) => /^bolt\s*\d+/i.test(s.title)); if (!bolts.length) return null;
    }
    const root = wrap(); const lead = stripH1(secs[0].body).trim(); if (lead) root.appendChild(mdBlocks(d, lead, false, 0));
    const info = bolts.map((b) => { const units = (b.body.match(/\*\*Units:?\*\*:?\s*([^\n]*)/) || [])[1] || ""; const pts = parseInt((b.body.match(/(\d+)\s*(?:story\s*)?points?\b/i) || [])[1] || "0"); const count = parseInt((units.match(/^\s*(\d+)/) || [])[1] || "") || (b.body.match(/^\|\s*\d+\s*\|/gm) || []).length || (units.match(/\bU\d+\b/g) || []).length; return { title: b.title, pts, count }; });
    const max = Math.max(1, ...info.map((i) => i.pts));
    root.insertAdjacentHTML("beforeend", `<div class="bolts">${info.map((i) => `<div class="bolt"><b>${inline(i.title)}</b><span class="hint">${i.count ? i.count + " units" : ""}${i.pts ? ` · ${i.pts} points` : ""}</span>${i.pts ? `<div class="bar"><i style="width:${Math.round(100 * i.pts / max)}%"></i></div>` : ""}</div>`).join("")}</div>`);
    let n = 10;
    secs.slice(1).forEach((s) => { if (!s.title) return; const isBolt = /^bolt\s*\d+/i.test(s.title); const sec = section(d, n++, s.title, isBolt); if (s.group) sec.querySelector("summary").insertAdjacentHTML("beforeend", `<span class="chip muted">${esc(s.group)}</span>`); const facts = isBolt ? factsOf(s.body) : []; const rest = isBolt ? stripFacts(s.body) : s.body; if (facts.length) sec.secbody.insertAdjacentHTML("beforeend", `<dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${inline(v)}</dd>`).join("")}</dl>`); sec.secbody.appendChild(mdDiv(rest)); if (isBolt) { const m = s.title.match(/^(Bolt)\s*(\d+)/i); if (m) regRef("Bolt " + m[2], sec, s.title); } root.appendChild(sec); });
    return root;
  }

  /* --- contracts: every `## C1 · …` section; an OpenAPI-shaped YAML block becomes an operations table, a type sheet a table per type --- */
  function viewContracts(d) {
    const secs = splitHeadings(d.text, "##"); if (!secs.some((s) => /^C\d+\b/.test(s.title))) return null;
    const root = wrap(); const lead = stripH1(secs[0].body).trim(); if (lead) root.appendChild(mdBlocks(d, lead, false, 0));
    let n = 10;
    secs.slice(1).forEach((s) => {
      if (!s.title) return;
      const isC = /^C\d+\b/.test(s.title); const sec = section(d, n++, s.title, isC);
      if (isC) regRef(s.title.match(/^(C\d+)/)[1], sec, s.title);
      const parts = []; let last = 0; const re = /```ya?ml[^\n]*\n([\s\S]*?)```/g; let m; const body = s.body;
      while ((m = re.exec(body))) { if (m.index > last) parts.push({ md: body.slice(last, m.index) }); let y = null; try { y = typeof jsyaml !== "undefined" ? jsyaml.load(m[1]) : null; } catch { y = null; } parts.push({ yaml: m[1], data: y }); last = m.index + m[0].length; }
      if (last < body.length) parts.push({ md: body.slice(last) });
      parts.forEach((p) => {
        if (p.md !== undefined) { if (p.md.trim()) sec.secbody.appendChild(mdDiv(p.md)); return; }
        const y = p.data; let done = false;
        if (y && y.paths && typeof y.paths === "object") {
          const ops = []; Object.entries(y.paths).forEach(([path, methods]) => { if (!methods || typeof methods !== "object") return; Object.entries(methods).forEach(([method, op]) => { if (!/^(get|post|put|patch|delete|head|options)$/i.test(method) || !op || typeof op !== "object") return; ops.push({ method: method.toUpperCase(), path, id: str(op.operationId || ""), summary: str(op.summary || ""), codes: op.responses ? Object.keys(op.responses) : [] }); }); });
          if (ops.length) { sec.secbody.insertAdjacentHTML("beforeend", `<p class="hint">${ops.length} operations${y.info && y.info.title ? " · " + esc(str(y.info.title)) : ""}</p><div class="tablewrap"><table class="grid"><thead><tr><th>Method</th><th>Path</th><th>Operation</th><th>Summary</th><th>Responses</th></tr></thead><tbody>${ops.map((o) => `<tr data-op="${esc(o.id)}"><td><span class="chip ${/GET/.test(o.method) ? "ok" : /DELETE/.test(o.method) ? "warn" : "accent"}">${esc(o.method)}</span></td><td class="mono">${esc(o.path)}</td><td class="id">${esc(o.id)}</td><td>${inline(o.summary)}</td><td class="dim">${esc(o.codes.join(" "))}</td></tr>`).join("")}</tbody></table></div>`); sec.secbody.querySelectorAll("tr[data-op]").forEach((tr) => regRef(tr.dataset.op, tr, tr.textContent.trim().replace(/\s+/g, " "))); done = true; }
        }
        const schemas = y && y.components && y.components.schemas;
        if (schemas && typeof schemas === "object" && Object.keys(schemas).length) { sec.secbody.appendChild(schemaCards(schemas)); done = true; }
        if (!done && y && typeof y === "object" && !Array.isArray(y) && Object.keys(y).length && Object.values(y).every((v) => v && typeof v === "object" && !Array.isArray(v) && Object.values(v).every((f) => typeof f !== "object" || f === null || Array.isArray(f)))) {
          const notes = {}; let type = ""; p.yaml.split("\n").forEach((l) => { const t = l.match(/^([A-Za-z_][\w]*)\s*:/); if (t) { type = t[1]; return; } const mm = l.match(/^\s+([A-Za-z_][\w]*)\s*:\s*(.*?)\s*#\s*(.*)$/); if (mm) notes[type + "." + mm[1]] = mm[3]; });
          sec.secbody.insertAdjacentHTML("beforeend", Object.entries(y).map(([type, fields]) => `<div class="card flat" style="margin:6px 0 10px" data-type="${esc(type)}"><div class="chead"><h4>${esc(type)}</h4></div><div class="tablewrap"><table class="grid"><tbody>${Object.entries(fields).map(([f, t]) => `<tr><td class="id">${esc(f)}</td><td class="ty">${esc(str(t))}</td><td class="dim">${inline(notes[type + "." + f] || "")}</td></tr>`).join("")}</tbody></table></div></div>`).join(""));
          sec.secbody.querySelectorAll("[data-type]").forEach((c) => regRef(c.dataset.type, c, "")); done = true;
        }
        if (!done) { const pre = document.createElement("pre"); pre.className = "src"; pre.textContent = p.yaml; sec.secbody.appendChild(pre); }
      });
      root.appendChild(sec);
    });
    return root;
  }

  /* OpenAPI component schemas as folded cards: name, type, properties (type, format or enum or $ref, required, description) */
  function schemaCards(schemas) {
    const tyOf = (p) => { if (!p || typeof p !== "object") return ""; if (p.$ref) return str(p.$ref).split("/").pop(); if (p.enum) return list(p.enum).join(" | "); if (p.type === "array") return "array of " + (tyOf(p.items) || "?"); return [p.type, p.format].filter(Boolean).join(" ") + (p.pattern ? " /" + p.pattern + "/" : "") + (p.maxLength !== undefined ? " ≤" + p.maxLength : ""); };
    const root = document.createElement("div"); root.className = "cards";
    root.insertAdjacentHTML("beforeend", `<p class="hint">${Object.keys(schemas).length} schemas</p>`);
    Object.entries(schemas).forEach(([name, sc]) => {
      const props = (sc && sc.properties && typeof sc.properties === "object") ? Object.entries(sc.properties) : []; const req = new Set(list(sc && sc.required).map(str));
      const det = node(`<details class="sub" data-schema="${esc(name)}"><summary>${esc(name)} <span class="hint">· ${esc(str((sc && sc.type) || (props.length ? "object" : "")))}${props.length ? " · " + props.length + " properties" : ""}${sc && sc.enum ? " · " + list(sc.enum).join(" | ") : ""}</span></summary></details>`);
      if (sc && sc.description) det.insertAdjacentHTML("beforeend", `<p class="desc">${inline(str(sc.description))}</p>`);
      if (props.length) det.insertAdjacentHTML("beforeend", `<div class="tablewrap"><table class="grid"><tbody>${props.map(([f, p]) => `<tr><td class="id">${esc(f)}</td><td class="ty">${esc(tyOf(p))}</td><td>${req.has(f) ? '<span class="chip muted">required</span>' : ""}</td><td class="dim">${inline(str((p && p.description) || ""))}</td></tr>`).join("")}</tbody></table></div>`);
      else if (sc && !sc.enum) { const pre = document.createElement("pre"); pre.className = "src"; pre.textContent = JSON.stringify(sc, null, 2); det.appendChild(pre); }
      root.appendChild(det); regRef(name, det, str((sc && sc.description) || ""));
    });
    return root;
  }

  const VIEWS = [
    { key: /^entities$/, render: viewEntities },
    { key: /^rules$/, render: viewRules },
    { key: /^(components|logical-components)$/, render: viewComponents },
    { key: /^unit-of-work-dependency$/, render: viewUnitDeps },
    { key: /^unit-of-work-story-map$/, render: viewStoryMap },
    { key: /^unit-of-work$/, render: viewUnits },
    { key: /^(stories|user-stories)$/, render: viewStories },
    { key: /^(requirements|[a-z]+-requirements)$/, render: viewRequirements },
    { key: /^decisions$/, render: viewDecisions },
    { key: /^bolt-plan$/, render: viewBolts },
    { key: /^contract-summary$/, render: viewContracts },
    { key: /^(traceability|cross-unit-traceability)$/, render: viewTraceability },
  ];
  function viewFor(d) { if (d.kind === "questions" || d.kind === "review") return null; const k = keyOf(d); return VIEWS.find((v) => v.key.test(k)) || null; }

  /* ---------- the outline ---------- */
  function paintRail(docs) {
    const sig = JSON.stringify([docs.map((d) => [d.key, d.title, (el.col.querySelector(`#d-${CSS.escape(d.key)} summary h2`) || {}).textContent, [...el.col.querySelectorAll(`#d-${CSS.escape(d.key)} details.sec`)].map((s) => s.dataset.title)]), Object.keys(view.notes).filter((k) => (view.notes[k] || "").trim())]);
    if (sig === view.railSig) return; view.railSig = sig;
    let html = `<div class="railh"><span>Outline</span><span class="tools"><button type="button" data-all="open">Expand all</button><button type="button" data-all="close">Collapse all</button></span></div>`;
    if (view.gate && view.gate.summary) html += `<div class="rgroup"><button type="button" class="rdoc" data-go="b-summary"><span class="rcaret none">▶</span><span class="rtitle">Summary</span></button></div>`;
    if (view.gate && view.gate.brief) html += `<div class="rgroup"><button type="button" class="rdoc" data-go="b-brief"><span class="rcaret none">▶</span><span class="rtitle">Review</span></button></div>`;
    docs.forEach((d) => {
      const shown = el.col.querySelector(`#d-${CSS.escape(d.key)} summary h2`); const title = (shown && shown.textContent.trim()) || d.title || d.key;
      const secs = [...el.col.querySelectorAll(`#d-${CSS.escape(d.key)} details.sec`)];
      const block = $("d-" + d.key); const open = Object.prototype.hasOwnProperty.call(view.railOpen, d.key) ? view.railOpen[d.key] : !!(block && block.open);
      html += `<details class="rgroup" data-key="${esc(d.key)}"${open ? " open" : ""}><summary><span class="rdoc" data-go="d-${esc(d.key)}" title="${esc(title)}" role="button" tabindex="0"><span class="rcaret${secs.length ? "" : " none"}" title="${secs.length ? "Fold or unfold the sections" : ""}">▶</span><span class="rtitle">${esc(title)}</span>${(view.notes[d.key] || "").trim() ? '<i class="dot"></i>' : ""}${KIND[d.kind] ? `<span class="pill quiet">${KIND[d.kind]}</span>` : ""}</span></summary>` +
        secs.map((s) => `<button type="button" class="rsec" data-go="${esc(s.id)}" title="${esc(s.dataset.title)}">${esc(s.dataset.title)}</button>`).join("") + `</details>`;
    });
    el.rail.innerHTML = html;
  }
  el.rail.addEventListener("click", (e) => {
    const all = e.target.closest("[data-all]");
    if (all) { el.col.querySelectorAll("details").forEach((d) => { d.open = all.dataset.all === "open"; }); if (all.dataset.all === "open") drawDiagrams(el.col); el.rail.querySelectorAll("details.rgroup").forEach((g) => { g.open = all.dataset.all === "open"; view.railOpen[g.dataset.key] = g.open; }); return; }
    if (e.target.closest(".rcaret")) { const g = e.target.closest("details.rgroup"); if (g) { e.preventDefault(); g.open = !g.open; view.railOpen[g.dataset.key] = g.open; } return; }
    if (e.target.closest("summary")) e.preventDefault();
    const b = e.target.closest("[data-go]"); if (!b) return;
    const target = document.getElementById(b.dataset.go); if (!target) return;
    jumpTo(target);
    el.rail.querySelectorAll(".active").forEach((x) => x.classList.remove("active")); b.classList.add("active");
    if (matchMedia("(max-width: 900px)").matches) el.rail.classList.remove("show");
  });
  el.rail.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.closest(".rdoc")) { e.preventDefault(); e.target.closest(".rdoc").click(); } });
  el.railtoggle.addEventListener("click", () => el.rail.classList.toggle("show"));
  el.col.addEventListener("click", (e) => {
    const sb = e.target.closest(".seg button");
    if (sb) { e.preventDefault(); e.stopPropagation(); view.mode[sb.dataset.key] = sb.dataset.mode; view.painted = ""; paintAll(); return; }
    const nb = e.target.closest(".notebtn");
    if (nb) {
      e.preventDefault(); e.stopPropagation();
      const key = nb.dataset.key; const box = $("nb-" + key); const det = nb.closest("details");
      if (box.hidden) { box.hidden = false; det.open = true; view.openNotes.add(key); nb.setAttribute("aria-pressed", "true"); $("nt-" + key).focus(); }
      else { box.hidden = true; view.openNotes.delete(key); nb.setAttribute("aria-pressed", String(!!(view.notes[key] || "").trim())); }
    }
  });
  el.col.addEventListener("toggle", (e) => { const d = e.target; if (d.open) drawDiagrams(d); }, true);

  /* ---------- notes ---------- */
  function noteEdited(key, text) {
    view.notes[key] = text; view.unsaved = true; setNoteStat(key, "Unsaved…");
    clearTimeout(view.noteTimer); view.noteTimer = setTimeout(flushNotes, 700);
  }
  function setNoteStat(key, t, cls) { const s = $("ns-" + key); if (s) { s.textContent = t; s.className = "stat" + (cls ? " " + cls : ""); } }
  async function flushNotes() {
    clearTimeout(view.noteTimer);
    if (view.saving || !view.unsaved || !db || !view.id) return;
    view.saving = true; const sent = JSON.stringify(view.notes);
    Object.keys(view.notes).forEach((k) => setNoteStat(k, "Saving…"));
    const ok = await patch({ notes: Object.assign({}, view.notes) });
    view.saving = false;
    if (ok) { if (JSON.stringify(view.notes) === sent) { view.unsaved = false; Object.keys(view.notes).forEach((k) => setNoteStat(k, "Saved " + clock())); view.railSig = ""; paintRail(docList()); } else flushNotes(); }
    else Object.keys(view.notes).forEach((k) => setNoteStat(k, "Couldn’t save. It retries when you type.", "warn"));
  }
  async function patch(fields) {
    try { await db.doc("gates/" + view.id).update(fields); return true; }
    catch (e) {
      setStatus(e && e.code === "invalid_argument" ? "You can read this gate but not save notes to it. Ask the owner for Contributor access." : "Couldn’t save. Check your connection and try again.", "warn");
      return false;
    }
  }
  if (window.ResizeObserver) new ResizeObserver(() => { document.documentElement.style.setProperty("--head-h", document.querySelector(".head").offsetHeight + "px"); }).observe(document.querySelector(".head"));
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { view.painted = ""; paintAll(); });
  new MutationObserver(() => { view.painted = ""; paintAll(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- boot ---------- */
  function route() { const id = gateId(); if (id) showGate(id); else showIndex(); }
  window.addEventListener("hashchange", route);
  route();
  (async () => {
    db = window.claude && typeof window.claude.use === "function" ? await window.claude.use("db") : null;
    if (!db) { el.lede.textContent = "Sign in to claude.ai to read this gate."; el.lede.hidden = false; el.list.innerHTML = ""; el.col.innerHTML = ""; el.rail.innerHTML = ""; return; }
    route();
  })();
})();
</script>
